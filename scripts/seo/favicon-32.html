<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 32px;
        height: 32px;
        overflow: hidden;
        background: #fff5e6;
      }

      .mark {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: 1.5px solid #0a0a0a;
        background: #ffffff;
        position: relative;
      }

      .n {
        position: absolute;
        left: 5px;
        top: 4px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        color: #0a0a0a;
      }

      .bar {
        position: absolute;
        right: 6px;
        top: 7px;
        width: 3px;
        height: 16px;
        background: #ff2d6b;
      }

      .dot {
        position: absolute;
        right: 5px;
        top: 4px;
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: #00c2ff;
        border: 1px solid #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <div class="n">N</div>
      <div class="bar"></div>
      <div class="dot"></div>
    </div>
  </body>
</html>
